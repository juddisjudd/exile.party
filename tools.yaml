    author: FrederickFartHammer
    headline: Edit your loot filter, price check and build regex without leaving the game
    description: >-
      Overlay that edits your loot filter, price checks items, and generates regex without leaving
      the game.
    url: https://scalpel.fourth.party/
    games: [poe1, poe2]
    category: overlays-and-companions
    tags: [overlay, filter-editor, price-check, regex]
    platforms: [windows, linux]
    pricing: free
    openSource: true
    source: https://github.com/scalpelpoe/scalpel
    byMaintainer: true
    editorsPick: true
    status: active
    lastVerified: 2026-09-07
    icon: scalpel.png
    screenshots:
      - filter-editor.webp
      - price-check.webp
      - dust-explorer.webp

